name: Test, build, and publish Docker image

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install runtime dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  image-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image for validation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: servicetag-ci:local
      - name: Smoke test running image
        run: |
          set -eu
          docker run -d --name servicetag-ci -p 127.0.0.1:3000:3000 servicetag-ci:local
          trap 'docker logs servicetag-ci; docker rm -f servicetag-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Container did not become healthy' >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent 'http://127.0.0.1:3000/api/v2/identifier.json' | python3 -c 'import json, sys; data = json.load(sys.stdin); assert len(data["identifiers"]) == 1; assert data["identifiers"][0]["long"] and data["identifiers"][0]["short"]'

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, image-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and publish Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
